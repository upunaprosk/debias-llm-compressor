name: Tests

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # These versions match the llm-compressor 0.8.1 release stack.
      # They are installed explicitly for unit tests because the
      # debias-sparsegpt package intentionally does not own the ML stack.
      - name: Install test runtime
        run: |
          python -m pip install \
            "numpy<=2.3.3" \
            "torch==2.8.0" \
            "transformers==4.56.2" \
            "datasets==4.1.1"

      - name: Install patched llm-compressor
        run: |
          mkdir -p third_party

          git clone --depth 1 --branch 0.8.1 \
            https://github.com/vllm-project/llm-compressor.git \
            third_party/llm-compressor

          git -C third_party/llm-compressor apply --check \
            "$PWD/patches/llm_compressor_0.8.1_mixed_calibration.patch"

          git -C third_party/llm-compressor apply \
            "$PWD/patches/llm_compressor_0.8.1_mixed_calibration.patch"

          BUILD_TYPE=release python -m pip install \
            -e third_party/llm-compressor

      - name: Verify patched backend
        run: |
          python -c "from llmcompressor.args.dataset_arguments import DatasetArguments; assert 'no_sampler' in DatasetArguments.__dataclass_fields__; print('Patched backend OK')"

      - name: Install package
        run: python -m pip install --no-deps -e .

      - name: Install development tools
        run: python -m pip install pytest ruff

      - name: Check package import
        run: |
          python -c "import debias_sparsegpt; print('debias_sparsegpt import OK')"

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run tests
        run: python -m pytest -v --tb=short