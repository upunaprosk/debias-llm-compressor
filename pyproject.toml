[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debias-sparsegpt"
version = "0.1.0"
description = "Bias-aware SparseGPT pruning for large language models"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Irina Proskurina" },
]

dependencies = [
    "numpy",
    "torch",
    "transformers",
    "datasets",
    "loguru",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
debias-sparsegpt = "debias_sparsegpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]